<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="TETRA: juego de bloques que caen, en el navegador. Jugá solo o en batallas online con amigos, y apostá en sats si querés." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#05080c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TETRA" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2304080d'/%3E%3Cpath d='M10 14h18v10H10zm18 10h18v10H28zm-8 10h18v10H20z' fill='%23d94ae8'/%3E%3C/svg%3E" />
    <title>TETRA</title>
  </head>
  <body> 
    <div id="app">
      <div id="game-root"></div>
      <div id="hud-overlay" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Registrar el service worker (PWA instalable). Se omite en localhost
      // para no interferir con el HMR de desarrollo.
      if ('serviceWorker' in navigator) {
        const host = location.hostname;
        const isLocal = host === 'localhost' || host === '127.0.0.1' || host === '[::1]';
        if (!isLocal) {
          window.addEventListener('load', () => {
            let reloadingForUpdate = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              if (reloadingForUpdate) return;
              reloadingForUpdate = true;
              location.reload();
            });
            navigator.serviceWorker
              .register('/sw.js', { updateViaCache: 'none' })
              .then((registration) => registration.update())
              .catch(() => {});
          });
        }
      }
    </script>
  </body>
</html>
